    text-shadow: 0 0 10px #00ff88;
    background: rgba(0,0,0,0.75);
    padding: 20px 40px; border-radius: 12px;

// ── Scene ──────────────────────────────────────────────────────────────

// ── Terrain height function ───────────────────────────────────────────
function getH(x, z) {
    return Math.sin(x * 0.04) * 4
         + Math.cos(z * 0.06) * 3
         + Math.sin(x * 0.09 + z * 0.08) * 2
         + Math.cos(x * 0.15 - z * 0.12) * 1;
}

// ── Terrain ───────────────────────────────────────────────────────────
const TSIZE = 220, TSEG = 60;
const terrGeo = new THREE.PlaneGeometry(TSIZE, TSIZE, TSEG, TSEG);
terrGeo.rotateX(-Math.PI / 2);
const tv = terrGeo.attributes.position.array;
for (let i = 0; i < tv.length; i += 3) tv[i + 1] = getH(tv[i], tv[i + 2]);
terrGeo.computeVertexNormals();
const terrain = new THREE.Mesh(terrGeo,
    new THREE.MeshLambertMaterial({ color: 0x2d5a1b }));
terrain.receiveShadow = true;
scene.add(terrain);

// ── Grass patches (color variation) ──────────────────────────────────
for (let i = 0; i < 200; i++) {
    const x = (Math.random() - 0.5) * 200;
    const z = (Math.random() - 0.5) * 200;
    const patch = new THREE.Mesh(
        new THREE.PlaneGeometry(2 + Math.random() * 3, 2 + Math.random() * 3),
        new THREE.MeshLambertMaterial({ color: 0x3d7a25, transparent: true, opacity: 0.7 })
    );
    patch.rotation.x = -Math.PI / 2;
    patch.rotation.z = Math.random() * Math.PI;
    patch.position.set(x, getH(x, z) + 0.05, z);
    scene.add(patch);
}

// ── House builder ─────────────────────────────────────────────────────
function makeHouse(x, z, rot = 0) {
    const g = new THREE.Group();
    g.rotation.y = rot;

    // Walls
    const wall = new THREE.Mesh(
        new THREE.BoxGeometry(7, 5, 7),
        new THREE.MeshLambertMaterial({ color: 0x9c7c4a })
    );
    wall.position.y = 2.5; wall.castShadow = true; wall.receiveShadow = true;
    g.add(wall);

    // Roof
    const roof = new THREE.Mesh(
        new THREE.ConeGeometry(6, 4, 4),
        new THREE.MeshLambertMaterial({ color: 0x5a2d00 })
    );
    roof.position.y = 7; roof.rotation.y = Math.PI / 4; roof.castShadow = true;
    g.add(roof);

    // Door
    g.add(Object.assign(new THREE.Mesh(
        new THREE.BoxGeometry(1.4, 2.8, 0.15),
        new THREE.MeshLambertMaterial({ color: 0x3d1c02 })
    ), { position: new THREE.Vector3(0, 1.4, 3.58) }));

    // Windows with glow
    [-2.2, 2.2].forEach(wx => {
        const win = new THREE.Mesh(
            new THREE.BoxGeometry(1.4, 1.2, 0.15),
            new THREE.MeshLambertMaterial({ color: 0xffe87c, emissive: 0xaa8800, emissiveIntensity: 0.5 })
        );
        win.position.set(wx, 2.8, 3.58);
        g.add(win);
    });

    const wl = new THREE.PointLight(0xffcc44, 0.8, 12);
    wl.position.set(0, 2.5, 4);
    g.add(wl);

    const h = getH(x, z);
    g.position.set(x, h, z);
    scene.add(g);
}

// ── Tree builder ──────────────────────────────────────────────────────
function makeTree(x, z) {
    const g = new THREE.Group();
    g.add(Object.assign(new THREE.Mesh(
        new THREE.CylinderGeometry(0.22, 0.32, 2.5, 7),
        new THREE.MeshLambertMaterial({ color: 0x4a2800 })
    ), { position: new THREE.Vector3(0, 1.25, 0) }));

    const leafH = [3.5, 5.2, 6.5];
    const leafR = [2.2, 1.8, 1.2];
    leafH.forEach((ly, i) => {
        const leaf = new THREE.Mesh(
            new THREE.ConeGeometry(leafR[i], 2.5, 7),
            new THREE.MeshLambertMaterial({ color: i === 0 ? 0x1a5200 : 0x245e00 })
        );
        leaf.position.y = ly;
        leaf.castShadow = true;
        g.add(leaf);
    });

    const h = getH(x, z);
    g.position.set(x, h, z);
    scene.add(g);
}

// ── Rick character ────────────────────────────────────────────────────
function makeRick() {
    const g = new THREE.Group();
    const WHITE = new THREE.MeshLambertMaterial({ color: 0xffffff });
    const SK = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
    const BLUE = new THREE.MeshLambertMaterial({ color: 0x6688ff });

    // Legs
    [-0.2, 0.2].forEach(x => {
        const l = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.8, 0.28), BLUE);
        l.position.set(x, 0.4, 0);
        g.add(l);
    });
    // Body (white coat)
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.9, 0.36), WHITE);
    body.position.y = 1.05;
    g.add(body);
    // Arms
    [-0.52, 0.52].forEach(x => {
        const a = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.7, 0.22), WHITE);
        a.position.set(x, 1.05, 0);
        g.add(a);
    });
    // Head
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.46, 0.46), SK);
    head.position.y = 1.73;
    g.add(head);
    // Hair (white spiky)
    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), new THREE.MeshLambertMaterial({ color: 0xdddddd }));
    hair.scale.y = 0.6;
    hair.position.y = 1.98;
    g.add(hair);
    // Portal gun
    const gun = new THREE.Group();
    const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.45), new THREE.MeshLambertMaterial({ color: 0x33dd33 }));
    const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.3, 8), new THREE.MeshLambertMaterial({ color: 0x22aa22 }));
    gunBarrel.rotation.x = Math.PI / 2;
    gunBarrel.position.z = 0.38;
    gun.add(gunBody, gunBarrel);
    const glowBall = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshBasicMaterial({ color: 0x00ff88 }));
    glowBall.position.z = 0.55;
    gun.add(glowBall);
    const gLight = new THREE.PointLight(0x00ff88, 1, 3);
    gLight.position.z = 0.55;
    gun.add(gLight);
    gun.position.set(-0.65, 1.0, 0.2);
    g.add(gun);

    return g;
}

document.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
document.addEventListener('keyup',   e => { keys[e.code] = false; });

let yaw = 0, pitch = 0.15;
let locked = false;

renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());
document.addEventListener('pointerlockchange', () => {
    locked = document.pointerLockElement === renderer.domElement;
    document.getElementById('clickprompt').style.display = locked ? 'none' : 'flex';
});
document.addEventListener('mousemove', e => {
    if (!locked) return;
    yaw   -= e.movementX * 0.0022;
    pitch -= e.movementY * 0.0022;
    pitch = Math.max(-0.6, Math.min(0.6, pitch));
});

// ── Utility ───────────────────────────────────────────────────────────
function showMsg(txt, ms = 4000) {
    const el = document.getElementById('message');
    el.textContent = txt;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => el.style.display = 'none', ms);
}

// ── Main loop ─────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let rmFloatRocks = [];

// collect floating rocks
rmScene.children.forEach(c => { if (c.userData.floatOffset !== undefined) rmFloatRocks.push(c); });

function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    time += dt;

    // ── UFO flight path ──────────────────────────────────────────────
    ufoT += dt * 0.4;
    ufoG.position.x = Math.sin(ufoT) * 55 + Math.cos(ufoT * 0.5) * 20;
    ufoG.position.z = Math.cos(ufoT * 0.8) * 55 + Math.sin(ufoT * 1.2) * 15;
    ufoG.position.y = 22 + Math.sin(ufoT * 1.5) * 6;
    ufoG.rotation.y += dt * 1.2;
    beam.material.opacity = 0.07 + Math.abs(Math.sin(time * 4)) * 0.08;

    // UFO rim lights flicker
    let li = 0;
    ufoG.children.forEach(c => {
        if (c.isMesh && c.geometry.type === 'SphereGeometry' && c !== dome) {
            c.material.emissiveIntensity = 0.5 + Math.sin(time * 6 + li * 0.8) * 0.5;
            li++;
        }
    });

    // ── Portals ──────────────────────────────────────────────────────
    portalRing.rotation.z += dt * 1.5;
    portalFill.material.opacity = 0.4 + Math.sin(time * 2) * 0.15;
    portalLight.intensity = 2.5 + Math.sin(time * 3) * 0.5;

    rmExitPortal.children[0].rotation.z += dt * 1.5;
    rmExitLight.intensity = 2.5 + Math.sin(time * 3) * 0.5;

    // ── Floating rocks in RM ─────────────────────────────────────────
    rmFloatRocks.forEach(r => {
        r.position.y += Math.sin(time * r.userData.floatSpeed + r.userData.floatOffset) * 0.02;
        r.rotation.x += dt * 0.3;
        r.rotation.y += dt * 0.2;
    });

    // ── Rick & Morty idle animations ─────────────────────────────────
    if (inRM) {
        rick.rotation.y = -Math.PI / 4 + Math.sin(time * 0.7) * 0.3;
        morty.rotation.y = -Math.PI / 3 + Math.sin(time * 0.9 + 1) * 0.25;
        morty.position.y = 0.5 + Math.abs(Math.sin(time * 1.5)) * 0.15; // bounce
    }

    // ── Player movement ──────────────────────────────────────────────
    const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const rgt = new THREE.Vector3( Math.cos(yaw), 0, -Math.sin(yaw));
    const moveDir = new THREE.Vector3();

    if (keys['KeyW']) moveDir.add(fwd);
    if (keys['KeyS']) moveDir.sub(fwd);
    if (keys['KeyA']) moveDir.sub(rgt);
    if (keys['KeyD']) moveDir.add(rgt);

    const moving = moveDir.lengthSq() > 0;
    if (moving) {
        moveDir.normalize();
        pVel.x += (moveDir.x * 6 - pVel.x) * 0.25;
        pVel.z += (moveDir.z * 6 - pVel.z) * 0.25;
        walkPhase += dt * 9;
    } else {
        pVel.x *= 0.78;
        pVel.z *= 0.78;
    }

    if (keys['Space'] && onGround) {
        pVel.y = 9;
        onGround = false;
    }

    pVel.y -= 22 * dt;
    pPos.addScaledVector(pVel, dt);
    pPos.x = Math.max(-100, Math.min(100, pPos.x));
    pPos.z = Math.max(-100, Math.min(100, pPos.z));

    // Ground collision
    let groundY;
    if (inRM) {
        const lx = pPos.x - RM_OFFSET.x;
        const lz = pPos.z - RM_OFFSET.z;
        groundY = RM_OFFSET.y + Math.sin(lx * 0.1) * 2 + Math.cos(lz * 0.08) * 1.5 + 0.5;
    } else {
        groundY = getH(pPos.x, pPos.z);
    }

    if (pPos.y <= groundY + 1.0) {
        pPos.y = groundY + 1.0;
        pVel.y = 0;
        onGround = true;
    } else {
        onGround = false;
    }

    player.position.copy(pPos);
    player.position.y -= 1.0;
    player.rotation.y = yaw;

    // Walk animation
    const lSwing = Math.sin(walkPhase) * (moving ? 0.45 : 0);
    legL.rotation.x =  lSwing;
    legR.rotation.x = -lSwing;
    armL.rotation.x = -lSwing * 0.6;
    armR.rotation.x =  lSwing * 0.6;

    // Lantern flicker
    lanternLight.intensity = 2.2 + Math.sin(time * 11) * 0.3 + Math.sin(time * 7.3) * 0.2;

    // ── Portal teleportation ─────────────────────────────────────────
    if (portalCD > 0) portalCD -= dt;

    if (!inRM && portalCD <= 0) {
        const d = pPos.distanceTo(portalG.position);
        if (d < 3.5) {
            inRM = true;
            portalCD = 3;

            // Move player to RM world start
            pPos.set(RM_OFFSET.x + 2, RM_OFFSET.y + 3, RM_OFFSET.z + 2);
            pVel.set(0, 0, 0);

            rmScene.visible = true;
            scene.background = new THREE.Color(0x220044);
            scene.fog = new THREE.Fog(0x220044, 50, 150);
            document.getElementById('dimension').style.display = 'block';
            showMsg('⚡ Willkommen in der Rick & Morty Dimension! Finde Rick & Morty! ⚡', 6000);
        }
    }

    if (inRM && portalCD <= 0) {
        const exitPos = new THREE.Vector3(RM_OFFSET.x, RM_OFFSET.y + 3.5, RM_OFFSET.z);
        const d = pPos.distanceTo(exitPos);
        if (d < 3.5) {
            inRM = false;
            portalCD = 3;

            pPos.set(-12, getH(-12, 18) + 3, 20);
            pVel.set(0, 0, 0);

            scene.background = new THREE.Color(0x0a0520);
            scene.fog = new THREE.Fog(0x0a0520, 60, 180);
            document.getElementById('dimension').style.display = 'none';
            showMsg('Zurück in der normalen Welt!', 3000);
        }
    }

    // ── Camera (third-person) ────────────────────────────────────────
    const camTarget = pPos.clone().add(new THREE.Vector3(0, 0.8, 0));
    const camDist = 6;
    const camX = camTarget.x + Math.sin(yaw) * camDist * Math.cos(pitch);
    const camY = camTarget.y + Math.sin(pitch) * camDist + 1.5;
    const camZ = camTarget.z + Math.cos(yaw) * camDist * Math.cos(pitch);
    camera.position.set(camX, camY, camZ);
    camera.lookAt(camTarget);

    renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

showMsg('Klicke um zu spielen • Finde das grüne Portal!', 5000);
</script>
</body>
</html>
