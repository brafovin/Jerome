<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>UFO Fly</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
#ui {
    position: fixed; top: 15px; left: 15px; z-index: 10;
    color: #00ff88; font-size: 13px;
    text-shadow: 0 0 8px #00ff88;
    line-height: 1.8; pointer-events: none;
}
#title { font-size: 22px; font-weight: bold; color: #fff; text-shadow: 0 0 15px #00ff88; margin-bottom: 8px; letter-spacing: 3px; }
#crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); color: rgba(255,255,255,0.5); font-size: 18px; pointer-events: none; z-index: 10; }
#message {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
    color: #00ff88; font-size: 18px; font-weight: bold; text-align: center;
    text-shadow: 0 0 15px #00ff88; background: rgba(0,0,0,0.7);
    padding: 12px 24px; border-radius: 10px; border: 1px solid #00ff88;
    display: none; max-width: 520px; pointer-events: none; z-index: 10;
}
#clickprompt {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #fff; font-size: 20px; font-weight: bold; text-shadow: 0 0 10px #00ff88;
    background: rgba(0,0,0,0.8); padding: 24px 44px; border-radius: 14px;
    border: 2px solid #00ff88; text-align: center; z-index: 20; cursor: pointer;
}
#dimension {
    position: fixed; top: 15px; right: 15px; z-index: 10;
    color: #ff88ff; font-size: 15px; font-weight: bold;
    text-shadow: 0 0 10px #ff88ff; display: none;
}
#loading {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #00ff88; font-size: 24px; z-index: 30;
    text-shadow: 0 0 15px #00ff88;
}
</style>
</head>
<body>
<div id="loading">Laden...</div>
<div id="ui" style="display:none">
    <div id="title">&#x1F6F8; UFO FLY</div>
    W A S D &#8212; Laufen / UFO steuern<br>
    Leertaste &#8212; Springen / UFO hoch<br>
    Shift &#8212; UFO runter<br>
    Maus &#8212; Kamera<br>
    <b style="color:#00ffff">E</b> &#8212; UFO einsteigen/aussteigen<br><br>
    Finde das gruene Portal!
</div>
<div id="crosshair" style="display:none">+</div>
<div id="message"></div>
<div id="dimension">&#x26A1; RICK &amp; MORTY DIMENSION &#x26A1;</div>
<div id="clickprompt">
    &#x1F6F8; UFO FLY &#x1F6F8;<br><br>
    <span style="font-size:15px">Klicke zum Spielen<br>Finde das Portal zu Rick &amp; Morty!</span>
</div>

<script>
// Load Three.js dynamically with fallback CDNs
(function loadThree(urls, idx) {
    if (idx >= urls.length) {
        document.getElementById('loading').textContent = 'Fehler: Three.js konnte nicht geladen werden.';
        return;
    }
    const s = document.createElement('script');
    s.src = urls[idx];
    s.onload = startGame;
    s.onerror = () => loadThree(urls, idx + 1);
    document.head.appendChild(s);
})([
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://unpkg.com/three@0.128.0/build/three.min.js'
], 0);

function startGame() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('ui').style.display = 'block';
    document.getElementById('crosshair').style.display = 'block';

    // ── Scene ────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0520);
    scene.fog = new THREE.Fog(0x0a0520, 60, 200);

    const W = window.innerWidth, H = window.innerHeight;
    const camera = new THREE.PerspectiveCamera(70, W / H, 0.1, 800);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(W, H);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // ── Lights ───────────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0x334466, 0.7));
    const moon = new THREE.DirectionalLight(0x8899cc, 0.5);
    moon.position.set(60, 100, 40);
    moon.castShadow = true;
    moon.shadow.mapSize.set(2048, 2048);
    moon.shadow.camera.far = 300;
    moon.shadow.camera.left = -120;
    moon.shadow.camera.right = 120;
    moon.shadow.camera.top = 120;
    moon.shadow.camera.bottom = -120;
    scene.add(moon);

    // ── Stars ────────────────────────────────────────────────────────
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(3000 * 3);
    for (let i = 0; i < starPos.length; i++) starPos[i] = (Math.random() - 0.5) * 600;
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 })));

    // Moon sphere
    const moonSphere = new THREE.Mesh(
        new THREE.SphereGeometry(8, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xeeeedd })
    );
    moonSphere.position.set(120, 150, -200);
    scene.add(moonSphere);

    // ── Terrain ──────────────────────────────────────────────────────
    function getH(x, z) {
        return Math.sin(x * 0.04) * 4
             + Math.cos(z * 0.06) * 3
             + Math.sin(x * 0.09 + z * 0.08) * 2
             + Math.cos(x * 0.15 - z * 0.12) * 0.8;
    }

    const tGeo = new THREE.PlaneGeometry(220, 220, 60, 60);
    tGeo.rotateX(-Math.PI / 2);
    const tv = tGeo.attributes.position.array;
    for (let i = 0; i < tv.length; i += 3) tv[i + 1] = getH(tv[i], tv[i + 2]);
    tGeo.computeVertexNormals();
    const terrain = new THREE.Mesh(tGeo, new THREE.MeshLambertMaterial({ color: 0x2a5518 }));
    terrain.receiveShadow = true;
    scene.add(terrain);

    // ── Houses ───────────────────────────────────────────────────────
    function makeHouse(x, z, ry) {
        const g = new THREE.Group();
        const wall = new THREE.Mesh(new THREE.BoxGeometry(7, 5, 7), new THREE.MeshLambertMaterial({ color: 0x9c7c4a }));
        wall.position.y = 2.5; wall.castShadow = true; wall.receiveShadow = true;
        g.add(wall);
        const roof = new THREE.Mesh(new THREE.ConeGeometry(6, 4, 4), new THREE.MeshLambertMaterial({ color: 0x5a2d00 }));
        roof.position.y = 7; roof.rotation.y = Math.PI / 4; roof.castShadow = true;
        g.add(roof);
        const door = new THREE.Mesh(new THREE.BoxGeometry(1.4, 2.8, 0.15), new THREE.MeshLambertMaterial({ color: 0x3d1c02 }));
        door.position.set(0, 1.4, 3.58); g.add(door);
        [-2.2, 2.2].forEach(wx => {
            const win = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.2, 0.15),
                new THREE.MeshLambertMaterial({ color: 0xffe87c, emissive: 0xaa8800, emissiveIntensity: 0.5 }));
            win.position.set(wx, 2.8, 3.58); g.add(win);
        });
        const wl = new THREE.PointLight(0xffcc44, 1, 14);
        wl.position.set(0, 2.5, 4); g.add(wl);
        g.position.set(x, getH(x, z), z);
        g.rotation.y = ry || 0;
        scene.add(g);
    }
    makeHouse(-22, -18, 0.3); makeHouse(18, -28, -0.5);
    makeHouse(-35, 12, 1.2);  makeHouse(28, 22, -0.2);
    makeHouse(8, -45, 0.8);   makeHouse(-15, 35, -1.0);

    // ── Trees ────────────────────────────────────────────────────────
    function makeTree(x, z) {
        const g = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.32, 2.5, 7),
            new THREE.MeshLambertMaterial({ color: 0x4a2800 }));
        trunk.position.y = 1.25; trunk.castShadow = true; g.add(trunk);
        [[3.5, 2.2, 0x1a5200],[5.2, 1.8, 0x245e00],[6.5, 1.2, 0x2d7000]].forEach(([ly, r, col]) => {
            const leaf = new THREE.Mesh(new THREE.ConeGeometry(r, 2.5, 7), new THREE.MeshLambertMaterial({ color: col }));
            leaf.position.y = ly; leaf.castShadow = true; g.add(leaf);
        });
        g.position.set(x, getH(x, z), z); scene.add(g);
    }
    for (let i = 0; i < 55; i++) {
        const a = Math.random() * Math.PI * 2, r = 15 + Math.random() * 85;
        makeTree(Math.cos(a) * r, Math.sin(a) * r);
    }

    // ── Player ───────────────────────────────────────────────────────
    const player = new THREE.Group();
    const BLK  = new THREE.MeshLambertMaterial({ color: 0x111111 });
    const SKIN = new THREE.MeshLambertMaterial({ color: 0xffcc99 });

    const headM = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.42, 0.42), SKIN);
    headM.position.y = 1.62; headM.castShadow = true; player.add(headM);

    const hairM = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.16, 0.44), new THREE.MeshLambertMaterial({ color: 0x222222 }));
    hairM.position.y = 1.87; player.add(hairM);

    const bodyM = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.82, 0.32), BLK);
    bodyM.position.y = 0.95; bodyM.castShadow = true; player.add(bodyM);

    const legL = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.72, 0.24), BLK);
    const legR = legL.clone();
    legL.position.set(-0.17, 0.36, 0); legR.position.set(0.17, 0.36, 0);
    player.add(legL, legR);

    const armL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.65, 0.2), BLK);
    const armR = armL.clone();
    armL.position.set(-0.44, 0.92, 0); armR.position.set(0.44, 0.92, 0);
    player.add(armL, armR);

    const shoeMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
    const shoeL = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.12, 0.34), shoeMat);
    const shoeR = shoeL.clone();
    shoeL.position.set(-0.17, 0.06, 0.04); shoeR.position.set(0.17, 0.06, 0.04);
    player.add(shoeL, shoeR);

    // Lantern
    const lG = new THREE.Group();
    lG.add(new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.25, 8), new THREE.MeshLambertMaterial({ color: 0xb8860b })));
    const lGlass = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8),
        new THREE.MeshLambertMaterial({ color: 0xffee88, emissive: 0xffaa00, emissiveIntensity: 1.2, transparent: true, opacity: 0.9 }));
    lGlass.position.y = -0.22; lG.add(lGlass);
    const lHandle = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.18, 8), new THREE.MeshLambertMaterial({ color: 0xb8860b }));
    lHandle.position.y = -0.22; lG.add(lHandle);
    lG.position.set(0.62, 0.82, 0.1);
    player.add(lG);

    const lanternLight = new THREE.PointLight(0xffaa33, 2.5, 18);
    lanternLight.position.set(0.62, 0.7, 0.1);
    player.add(lanternLight);

    player.position.set(2, 5, 2);
    scene.add(player);

    // ── UFO ─────────────────────────────────────────────────────────
    const ufo = new THREE.Group();
    ufo.add(new THREE.Mesh(new THREE.CylinderGeometry(3.5, 2.8, 0.65, 24), new THREE.MeshLambertMaterial({ color: 0x7799bb })));
    const dome = new THREE.Mesh(new THREE.SphereGeometry(1.6, 16, 8, 0, Math.PI*2, 0, Math.PI/2),
        new THREE.MeshLambertMaterial({ color: 0x44ccff, transparent: true, opacity: 0.75 }));
    dome.position.y = 0.5; ufo.add(dome);

    const rimColors = [0x00ff88, 0xff4444, 0xffff00];
    const rimLights = [];
    for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        const rm = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8),
            new THREE.MeshBasicMaterial({ color: rimColors[i % 3] }));
        rm.position.set(Math.cos(a) * 3.2, 0, Math.sin(a) * 3.2);
        ufo.add(rm); rimLights.push(rm);
    }

    const beamMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 2.5, 10, 8, 1, true),
        new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.09, side: THREE.DoubleSide }));
    beamMesh.position.y = -5.3; ufo.add(beamMesh);

    const ufoLight = new THREE.PointLight(0x00ff88, 3, 28);
    ufoLight.position.y = -1; ufo.add(ufoLight);
    // UFO startet auf dem Boden
    const ufoStartX = 10, ufoStartZ = 10;
    ufo.position.set(ufoStartX, getH(ufoStartX, ufoStartZ) + 1.5, ufoStartZ);
    scene.add(ufo);

    // ── Zombies ──────────────────────────────────────────────────────
    const zombies = [];
    let zombiesKilled = 0;

    function makeZombie(x, z) {
        const g = new THREE.Group();
        const GREEN = new THREE.MeshLambertMaterial({ color: 0x4a7c3f });
        const DGREY = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const ZRED  = new THREE.MeshLambertMaterial({ color: 0x8b0000 });

        // Body (torn shirt)
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.3), GREEN);
        body.position.y = 0.95; body.castShadow = true; g.add(body);
        // Head
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.42, 0.42), GREEN);
        head.position.y = 1.6; head.castShadow = true; g.add(head);
        // Eyes (red glowing)
        [-0.1, 0.1].forEach(ex => {
            const eye = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.07, 0.05),
                new THREE.MeshBasicMaterial({ color: 0xff0000 }));
            eye.position.set(ex, 1.63, 0.22); g.add(eye);
        });
        // Hair (messy)
        const hair = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.14, 0.46), DGREY);
        hair.position.y = 1.84; g.add(hair);
        // Legs
        const legL = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.72, 0.24), DGREY);
        const legR = legL.clone();
        legL.position.set(-0.17, 0.36, 0); legR.position.set(0.17, 0.36, 0);
        g.add(legL, legR);
        // Arms (outstretched - zombie pose)
        const armGeo = new THREE.BoxGeometry(0.2, 0.62, 0.2);
        const armL2 = new THREE.Mesh(armGeo, GREEN);
        const armR2 = new THREE.Mesh(armGeo, GREEN);
        armL2.position.set(-0.44, 0.95, 0); armL2.rotation.x = -0.7; // arms forward
        armR2.position.set( 0.44, 0.95, 0); armR2.rotation.x = -0.7;
        g.add(armL2, armR2);
        // Blood splat
        const blood = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.2), ZRED);
        blood.position.set(0.1, 1.1, 0.16); blood.rotation.z = 0.3; g.add(blood);

        // Red eye glow
        const eyeLight = new THREE.PointLight(0xff0000, 0.4, 4);
        eyeLight.position.set(0, 1.63, 0.3); g.add(eyeLight);

        const h = getH(x, z);
        g.position.set(x, h, z);
        g.rotation.y = Math.random() * Math.PI * 2;

        g.userData = {
            walkDir: new THREE.Vector3(Math.random()-0.5, 0, Math.random()-0.5).normalize(),
            walkPhase: Math.random() * Math.PI * 2,
            wanderTimer: 2 + Math.random() * 4,
            legL, legR, armL: armL2, armR: armR2,
            alive: true,
            beamPull: 0,   // wie stark der Strahl zieht
            startY: h,
            eyeLight
        };
        scene.add(g);
        zombies.push(g);
        return g;
    }

    // 15 Zombies über die Map verteilt
    const zombieSpawns = [
        [20,-10],[- 5,30],[35,15],[-20,25],[10,-30],
        [40,-20],[-40,5],[15,45],[-10,-45],[50,30],
        [-50,20],[30,-40],[-35,-30],[5,55],[-55,-10]
    ];
    zombieSpawns.forEach(([x,z]) => makeZombie(x, z));

    // Zombie kill counter UI
    const killUI = document.createElement('div');
    killUI.style.cssText = 'position:fixed;bottom:20px;right:20px;color:#00ff88;font-size:16px;font-weight:bold;text-shadow:0 0 8px #00ff88;z-index:10;font-family:Arial;';
    killUI.textContent = 'Zombies: 0 / ' + zombies.length;
    document.body.appendChild(killUI);

    // ── Portal ───────────────────────────────────────────────────────
    const portalG = new THREE.Group();
    const portalRing = new THREE.Mesh(new THREE.TorusGeometry(3, 0.35, 16, 64),
        new THREE.MeshBasicMaterial({ color: 0x00ff88 }));
    portalG.add(portalRing);
    const portalFill = new THREE.Mesh(new THREE.CircleGeometry(3, 64),
        new THREE.MeshBasicMaterial({ color: 0x00cc66, transparent: true, opacity: 0.55, side: THREE.DoubleSide }));
    portalG.add(portalFill);
    const portalGlow = new THREE.Mesh(new THREE.CircleGeometry(4.2, 32),
        new THREE.MeshBasicMaterial({ color: 0x00ff44, transparent: true, opacity: 0.12, side: THREE.DoubleSide }));
    portalG.add(portalGlow);
    const pLight = new THREE.PointLight(0x00ff88, 3.5, 35);
    portalG.add(pLight);
    portalG.position.set(-12, getH(-12, 18) + 3.5, 18);
    scene.add(portalG);

    // ── Rick & Morty Dimension ────────────────────────────────────────
    const RM = new THREE.Vector3(0, 0, 500);
    const rmGroup = new THREE.Group();
    rmGroup.position.copy(RM);
    rmGroup.visible = false;
    scene.add(rmGroup);

    const rmGeo = new THREE.PlaneGeometry(160, 160, 40, 40);
    rmGeo.rotateX(-Math.PI / 2);
    const rmV = rmGeo.attributes.position.array;
    for (let i = 0; i < rmV.length; i += 3)
        rmV[i + 1] = Math.sin(rmV[i] * 0.1) * 2 + Math.cos(rmV[i+2] * 0.08) * 1.5;
    rmGeo.computeVertexNormals();
    rmGroup.add(new THREE.Mesh(rmGeo, new THREE.MeshLambertMaterial({ color: 0x2b1166 })));
    rmGroup.add(new THREE.AmbientLight(0x8844cc, 1.4));
    const rmSun = new THREE.DirectionalLight(0xff88ff, 0.8);
    rmSun.position.set(30, 60, 30); rmGroup.add(rmSun);

    // Alien plants
    for (let i = 0; i < 45; i++) {
        const ag = new THREE.Group();
        const at = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.22, 3, 6),
            new THREE.MeshLambertMaterial({ color: 0xcc00ff }));
        at.position.y = 1.5; ag.add(at);
        const ac = new THREE.Mesh(new THREE.SphereGeometry(1.2 + Math.random() * 0.6, 8, 8),
            new THREE.MeshLambertMaterial({ color: 0xff44ff, emissive: 0x440044, emissiveIntensity: 0.4 }));
        ac.position.y = 3.8; ag.add(ac);
        ag.position.set((Math.random()-0.5)*130, 0, (Math.random()-0.5)*130);
        rmGroup.add(ag);
    }

    // Floating rocks
    const floatRocks = [];
    for (let i = 0; i < 18; i++) {
        const r = new THREE.Mesh(new THREE.DodecahedronGeometry(1 + Math.random() * 2.5),
            new THREE.MeshLambertMaterial({ color: 0x7744aa }));
        r.position.set((Math.random()-0.5)*100, 8+Math.random()*16, (Math.random()-0.5)*100);
        r.userData.fo = Math.random() * Math.PI * 2;
        r.userData.fs = 0.4 + Math.random() * 0.6;
        r.userData.baseY = r.position.y;
        floatRocks.push(r); rmGroup.add(r);
    }

    // Rick
    function makeRick() {
        const g = new THREE.Group();
        const W = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const S = new THREE.MeshLambertMaterial({ color: 0xffcc99 });
        const B = new THREE.MeshLambertMaterial({ color: 0x6688ff });
        [-0.2,0.2].forEach(x => { const l=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.8,0.28),B); l.position.set(x,0.4,0); g.add(l); });
        const bd=new THREE.Mesh(new THREE.BoxGeometry(0.75,0.9,0.36),W); bd.position.y=1.05; g.add(bd);
        [-0.52,0.52].forEach(x => { const a=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.7,0.22),W); a.position.set(x,1.05,0); g.add(a); });
        const hd=new THREE.Mesh(new THREE.BoxGeometry(0.46,0.46,0.46),S); hd.position.y=1.73; g.add(hd);
        const hr=new THREE.Mesh(new THREE.SphereGeometry(0.3,8,8), new THREE.MeshLambertMaterial({color:0xdddddd}));
        hr.scale.y=0.6; hr.position.y=1.97; g.add(hr);
        // Portal gun
        const gg=new THREE.Group();
        gg.add(new THREE.Mesh(new THREE.BoxGeometry(0.12,0.12,0.45),new THREE.MeshLambertMaterial({color:0x33dd33})));
        const gb=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.3,8), new THREE.MeshLambertMaterial({color:0x22aa22}));
        gb.rotation.x=Math.PI/2; gb.position.z=0.38; gg.add(gb);
        const gbl=new THREE.Mesh(new THREE.SphereGeometry(0.07,8,8),new THREE.MeshBasicMaterial({color:0x00ff88}));
        gbl.position.z=0.55; gg.add(gbl);
        const gl2=new THREE.PointLight(0x00ff88,1.5,4); gl2.position.z=0.55; gg.add(gl2);
        gg.position.set(-0.65,1.0,0.22); g.add(gg);
        return g;
    }

    function makeMorty() {
        const g = new THREE.Group();
        const Y=new THREE.MeshLambertMaterial({color:0xffee22});
        const Br=new THREE.MeshLambertMaterial({color:0x8B6914});
        const S=new THREE.MeshLambertMaterial({color:0xffcc99});
        [-0.17,0.17].forEach(x=>{ const l=new THREE.Mesh(new THREE.BoxGeometry(0.24,0.7,0.24),Br); l.position.set(x,0.35,0); g.add(l); });
        const bd=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.82,0.32),Y); bd.position.y=0.95; g.add(bd);
        [-0.44,0.44].forEach(x=>{ const a=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.65,0.2),Y); a.position.set(x,0.92,0); g.add(a); });
        const hd=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.42,0.42),S); hd.position.y=1.58; g.add(hd);
        [-0.26,0.26].forEach(x=>{ const e=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,8),S); e.position.set(x,1.58,0); g.add(e); });
        const hr=new THREE.Mesh(new THREE.SphereGeometry(0.23,8,8),new THREE.MeshLambertMaterial({color:0x8B4513}));
        hr.position.y=1.8; g.add(hr);
        return g;
    }

    const rick = makeRick();
    rick.position.set(8, 0.5, 5); rick.rotation.y=-Math.PI/4;
    rmGroup.add(rick);
    const morty = makeMorty();
    morty.position.set(12, 0.5, 5); morty.rotation.y=-Math.PI/3;
    rmGroup.add(morty);

    // RM exit portal
    const rmExit = new THREE.Group();
    const rmRing = new THREE.Mesh(new THREE.TorusGeometry(3,0.35,16,64), new THREE.MeshBasicMaterial({color:0x00ff88}));
    rmExit.add(rmRing);
    rmExit.add(new THREE.Mesh(new THREE.CircleGeometry(3,64), new THREE.MeshBasicMaterial({color:0x00cc66,transparent:true,opacity:0.55,side:THREE.DoubleSide})));
    const rmExitLight = new THREE.PointLight(0x00ff88,3,30);
    rmExit.add(rmExitLight);
    // Exit portal steht bei (0,3.5,0) lokal = weit weg vom Spawn (20,4,20)
    rmExit.position.set(0, 3.5, 0);
    // Groesseres Glow-Objekt damit man es leichter findet
    const rmExitGlow = new THREE.Mesh(
        new THREE.CircleGeometry(5.5, 32),
        new THREE.MeshBasicMaterial({ color: 0x00ff44, transparent: true, opacity: 0.1, side: THREE.DoubleSide })
    );
    rmExit.add(rmExitGlow);
    // Extra starkes Licht damit das Portal von weitem sichtbar ist
    const rmExitBeacon = new THREE.PointLight(0x00ff88, 6, 60);
    rmExit.add(rmExitBeacon);
    rmGroup.add(rmExit);

    // ── Input ────────────────────────────────────────────────────────
    const keys = {};
    document.addEventListener('keydown', e => { keys[e.code] = true; if(['Space','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault(); });
    document.addEventListener('keyup',   e => { keys[e.code] = false; });

    let yaw = 0, pitch = 0.15, locked = false;
    let camDist = 8;
    document.addEventListener('wheel', e => {
        camDist += e.deltaY * 0.02;
        camDist = Math.max(3, Math.min(40, camDist));
    });
    renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());
    document.addEventListener('pointerlockchange', () => {
        locked = document.pointerLockElement === renderer.domElement;
        document.getElementById('clickprompt').style.display = locked ? 'none' : 'block';
    });
    document.addEventListener('mousemove', e => {
        if (!locked) return;
        yaw   -= e.movementX * 0.0022;
        pitch -= e.movementY * 0.0022;
        pitch  = Math.max(-1.2, Math.min(1.2, pitch));
        // UFO-Modus: Maus dreht auch das UFO
        if (inUFO) ufoYaw = yaw;
    });

    // ── UFO Upgrade System ────────────────────────────────────────────
    let ufoLevel = 1;
    const UFO_UPGRADES = [
        { level: 1, speed: 18, beamRadius: 3.5,  beamHeight: 18, beamColor: 0x00ff88, rimScale: 1.0,  label: 'Standard UFO' },
        { level: 2, speed: 24, beamRadius: 5.0,  beamHeight: 22, beamColor: 0x00ffff, rimScale: 1.3,  label: 'Upgrade 1: Breiter Strahl!' },
        { level: 3, speed: 30, beamRadius: 7.0,  beamHeight: 28, beamColor: 0xffff00, rimScale: 1.6,  label: 'Upgrade 2: Mega-Strahl!' },
        { level: 4, speed: 38, beamRadius: 9.5,  beamHeight: 35, beamColor: 0xff6600, rimScale: 2.0,  label: 'Upgrade 3: Feuer-Strahl!' },
        { level: 5, speed: 50, beamRadius: 13.0, beamHeight: 45, beamColor: 0xff00ff, rimScale: 2.5,  label: 'MAXLEVEL: ULTRA UFO!' },
    ];

    // Upgrade-Anzeige UI
    const upgradeUI = document.createElement('div');
    upgradeUI.style.cssText = 'position:fixed;top:15px;right:15px;z-index:10;color:#00ffff;font-size:14px;font-weight:bold;text-shadow:0 0 8px #00ffff;font-family:Arial;text-align:right;';
    upgradeUI.innerHTML = 'UFO Level 1<br><span style="color:#888;font-size:11px">Naechstes Upgrade: 20 kills</span>';
    document.body.appendChild(upgradeUI);

    function applyUFOUpgrade(lvl) {
        const up = UFO_UPGRADES[Math.min(lvl - 1, UFO_UPGRADES.length - 1)];
        // Strahl neu skalieren
        beamMesh.scale.set(up.beamRadius / 2.5, 1, up.beamRadius / 2.5);
        beamMesh.material.color.setHex(up.beamColor);
        ufoLight.color.setHex(up.beamColor);
        // UFO-Rim-Lichter vergroessern
        ufo.scale.set(up.rimScale, up.rimScale, up.rimScale);
        // Farbe der Rim-Lichter
        rimLights.forEach((r, i) => r.material.color.setHex(i % 2 === 0 ? up.beamColor : 0xffffff));
        // UI
        const next = UFO_UPGRADES[Math.min(lvl, UFO_UPGRADES.length - 1)];
        if (lvl >= UFO_UPGRADES.length) {
            upgradeUI.innerHTML = '<span style="color:#ff00ff">UFO MAXLEVEL &#9733;</span>';
        } else {
            upgradeUI.innerHTML = 'UFO Level ' + lvl + '<br><span style="color:#888;font-size:11px">Naechstes: ' + (lvl * 20) + ' kills</span>';
        }
    }

    function checkUFOUpgrade() {
        const newLevel = Math.min(Math.floor(zombiesKilled / 20) + 1, UFO_UPGRADES.length);
        if (newLevel > ufoLevel) {
            ufoLevel = newLevel;
            applyUFOUpgrade(ufoLevel);
            const up = UFO_UPGRADES[ufoLevel - 1];
            showMsg('🛸 UFO UPGRADE! ' + up.label + ' (Level ' + ufoLevel + ')', 5000);
            // Flash-Effekt
            ufoLight.intensity = 15;
            setTimeout(() => ufoLight.intensity = 3, 500);
        }
    }

    // ── State ────────────────────────────────────────────────────────
    const pPos = new THREE.Vector3(2, 6, 2);
    const pVel = new THREE.Vector3();
    let onGround = false, inRM = false, portalCD = 0;
    let walkPhase = 0, time = 0, ufoT = 0;
    let inUFO = false;
    let ufoYaw = 0;

    function showMsg(txt, ms) {
        const el = document.getElementById('message');
        el.textContent = txt;
        el.style.display = 'block';
        clearTimeout(el._t);
        el._t = setTimeout(() => el.style.display = 'none', ms || 4000);
    }

    // ── Game loop ────────────────────────────────────────────────────
    const clock = new THREE.Clock();

    function loop() {
        requestAnimationFrame(loop);
        const dt = Math.min(clock.getDelta(), 0.05);
        time += dt;

        // ── Zombies update ──────────────────────────────────────────
        zombies.forEach(z => {
            if (!z.userData.alive) return;
            const ud = z.userData;

            // Wandern
            ud.wanderTimer -= dt;
            if (ud.wanderTimer <= 0) {
                ud.walkDir.set(Math.random()-0.5, 0, Math.random()-0.5).normalize();
                ud.wanderTimer = 2 + Math.random() * 4;
                z.rotation.y = Math.atan2(ud.walkDir.x, ud.walkDir.z);
            }
            z.position.x += ud.walkDir.x * 1.2 * dt;
            z.position.z += ud.walkDir.z * 1.2 * dt;
            z.position.x = Math.max(-100, Math.min(100, z.position.x));
            z.position.z = Math.max(-100, Math.min(100, z.position.z));
            z.position.y = getH(z.position.x, z.position.z);

            // Walk animation
            ud.walkPhase += dt * 4;
            const ws = Math.sin(ud.walkPhase) * 0.4;
            ud.legL.rotation.x =  ws; ud.legR.rotation.x = -ws;

            // Strahl-Check: UFO direkt über Zombie → sofort töten
            if (inUFO) {
                const dx = ufo.position.x - z.position.x;
                const dz = ufo.position.z - z.position.z;
                const horizDist = Math.sqrt(dx*dx + dz*dz);
                const vertDist  = ufo.position.y - z.position.y;
                const upCur = UFO_UPGRADES[Math.min(ufoLevel - 1, UFO_UPGRADES.length - 1)];

                if (horizDist < upCur.beamRadius && vertDist > 0 && vertDist < upCur.beamHeight) {
                    ud.alive = false;
                    scene.remove(z);
                    zombiesKilled++;
                    killUI.textContent = 'Zombies getoetet: ' + zombiesKilled;
                    checkUFOUpgrade();
                    // Blut-Partikel
                    for (let p = 0; p < 10; p++) {
                        const part = new THREE.Mesh(
                            new THREE.SphereGeometry(0.08 + Math.random()*0.12, 5, 5),
                            new THREE.MeshBasicMaterial({ color: 0xaa0000 })
                        );
                        const kx = z.position.x + (Math.random()-0.5)*2;
                        const kz2 = z.position.z + (Math.random()-0.5)*2;
                        part.position.set(kx, getH(kx, kz2) + 0.05, kz2);
                        scene.add(part);
                        setTimeout(() => scene.remove(part), 4000);
                    }
                    // Respawn nach 5 Sekunden an zufälliger Position
                    setTimeout(() => {
                        const rx = (Math.random()-0.5) * 180;
                        const rz = (Math.random()-0.5) * 180;
                        const rh = getH(rx, rz);
                        z.position.set(rx, rh, rz);
                        z.rotation.set(0, Math.random()*Math.PI*2, 0);
                        z.userData.alive = true;
                        z.userData.beamPull = 0;
                        z.userData.walkDir.set(Math.random()-0.5, 0, Math.random()-0.5).normalize();
                        scene.add(z);
                    }, 5000);
                }
            }
        });

        // UFO
        ufo.rotation.y += dt * 1.3; // immer rotieren (sieht cool aus)
        if (inUFO) {
            // Spieler steuert das UFO mit WASD + Leertaste + Shift
            const ufFwd = new THREE.Vector3(-Math.sin(ufoYaw), 0, -Math.cos(ufoYaw));
            const ufRgt = new THREE.Vector3( Math.cos(ufoYaw), 0, -Math.sin(ufoYaw));
            const ufMv  = new THREE.Vector3();
            if (keys['KeyW'] || keys['ArrowUp'])    ufMv.add(ufFwd);
            if (keys['KeyS'] || keys['ArrowDown'])  ufMv.sub(ufFwd);
            if (keys['KeyA'] || keys['ArrowLeft'])  ufMv.sub(ufRgt);
            if (keys['KeyD'] || keys['ArrowRight']) ufMv.add(ufRgt);
            const curUp = UFO_UPGRADES[Math.min(ufoLevel - 1, UFO_UPGRADES.length - 1)];
            if (ufMv.lengthSq() > 0) { ufMv.normalize(); ufo.position.addScaledVector(ufMv, curUp.speed * dt); }
            if (keys['Space'])                               ufo.position.y += curUp.speed * 0.75 * dt;
            if (keys['ShiftLeft'] || keys['ShiftRight'])     ufo.position.y -= curUp.speed * 0.75 * dt;
            // Nicht unter Boden sinken
            const minY = getH(ufo.position.x, ufo.position.z) + 1.5;
            if (ufo.position.y < minY) ufo.position.y = minY;
            // Spieler folgt UFO
            pPos.set(ufo.position.x, ufo.position.y - 3, ufo.position.z);
        }
        // Wenn nicht im UFO: UFO bleibt wo es ist (steht auf dem Boden)
        beamMesh.material.opacity = inUFO ? (0.06 + Math.abs(Math.sin(time * 4)) * 0.08) : 0;

        // Portals spin
        portalRing.rotation.z += dt * 1.5;
        portalFill.material.opacity = 0.4 + Math.sin(time * 2.2) * 0.15;
        pLight.intensity = 2.8 + Math.sin(time * 3) * 0.6;
        rmRing.rotation.z += dt * 1.5;
        rmExitLight.intensity = 2.8 + Math.sin(time * 3) * 0.6;

        // Floating rocks
        floatRocks.forEach(r => {
            r.position.y = r.userData.baseY + Math.sin(time * r.userData.fs + r.userData.fo) * 1.5;
            r.rotation.x += dt * 0.25; r.rotation.y += dt * 0.18;
        });

        // Rick & Morty idle
        if (inRM) {
            rick.rotation.y = -Math.PI/4 + Math.sin(time * 0.7) * 0.3;
            morty.rotation.y = -Math.PI/3 + Math.sin(time * 0.9 + 1) * 0.25;
            morty.position.y = 0.5 + Math.abs(Math.sin(time * 1.8)) * 0.18;
        }

        // E-Taste: UFO einsteigen/aussteigen
        if (keys['KeyE'] && !keys['_ePrev']) {
            if (!inUFO && pPos.distanceTo(ufo.position) < 8) {
                inUFO = true;
                player.visible = false;
                pVel.set(0,0,0);
                ufoYaw = yaw;
                beamMesh.material.opacity = 0.1;
                showMsg('UFO! WASD=Fliegen  Leertaste=Hoch  Shift=Runter  E=Aussteigen', 5000);
            } else if (inUFO) {
                inUFO = false;
                player.visible = true;
                // UFO landet auf dem Boden
                ufo.position.y = getH(ufo.position.x, ufo.position.z) + 1.5;
                // Spieler landet neben dem UFO
                pPos.set(ufo.position.x + 5, getH(ufo.position.x + 5, ufo.position.z) + 1.5, ufo.position.z);
                pVel.set(0, 0, 0);
                showMsg('Ausgestiegen! Geh nah ans UFO und drucke E zum Einsteigen.', 3000);
            }
        }
        keys['_ePrev'] = keys['KeyE'];

        // Player move (nur wenn nicht im UFO)
        const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
        const rgt = new THREE.Vector3( Math.cos(yaw), 0, -Math.sin(yaw));
        const mv  = new THREE.Vector3();
        if (!inUFO) {
            if (keys['KeyW'] || keys['ArrowUp'])    mv.add(fwd);
            if (keys['KeyS'] || keys['ArrowDown'])  mv.sub(fwd);
            if (keys['KeyA'] || keys['ArrowLeft'])  mv.sub(rgt);
            if (keys['KeyD'] || keys['ArrowRight']) mv.add(rgt);
        }

        const moving = mv.lengthSq() > 0;
        if (moving) { mv.normalize(); pVel.x += (mv.x * 6 - pVel.x) * 0.25; pVel.z += (mv.z * 6 - pVel.z) * 0.25; walkPhase += dt * 9; }
        else if (!inUFO) { pVel.x *= 0.78; pVel.z *= 0.78; }

        if (keys['Space'] && onGround && !inUFO) { pVel.y = 9; onGround = false; }

        if (!inUFO) {
            pVel.y -= 22 * dt;
            pPos.addScaledVector(pVel, dt);
            pPos.x = Math.max(-102, Math.min(102, pPos.x));
            pPos.z = Math.max(-102, Math.min(102, pPos.z));
        }

        // Ground (nur wenn nicht im UFO)
        if (!inUFO) {
            let gY;
            if (inRM) {
                const lx = pPos.x - RM.x, lz = pPos.z - RM.z;
                gY = RM.y + Math.sin(lx * 0.1) * 2 + Math.cos(lz * 0.08) * 1.5 + 0.8;
            } else {
                gY = getH(pPos.x, pPos.z);
            }
            if (pPos.y < gY + 1.05) { pPos.y = gY + 1.05; pVel.y = 0; onGround = true; }
            else onGround = false;

            player.position.copy(pPos);
            player.position.y -= 1.05;
            player.rotation.y = yaw;
        }

        // UFO Nähe-Hinweis
        if (!inUFO && pPos.distanceTo(ufo.position) < 8) {
            document.getElementById('message').style.display = 'block';
            document.getElementById('message').textContent = 'Druecke E um das UFO zu betreten!';
        }

        // Walk anim
        const sw = Math.sin(walkPhase) * (moving ? 0.45 : 0);
        legL.rotation.x =  sw; legR.rotation.x = -sw;
        armL.rotation.x = -sw * 0.6; armR.rotation.x = sw * 0.6;

        // Lantern flicker
        lanternLight.intensity = 2.2 + Math.sin(time * 11) * 0.3 + Math.sin(time * 7.3) * 0.2;

        // Portal check
        if (portalCD > 0) portalCD -= dt;
        if (!inRM && portalCD <= 0 && pPos.distanceTo(portalG.position) < 3.8) {
            inRM = true; portalCD = 5;
            // Spawn weit weg vom Ausgangsportal (das bei RM.x/z ist)
            pPos.set(RM.x + 20, RM.y + 4, RM.z + 20); pVel.set(0, 0, 0);
            rmGroup.visible = true;
            scene.background = new THREE.Color(0x1a0033);
            scene.fog = new THREE.Fog(0x1a0033, 50, 140);
            document.getElementById('dimension').style.display = 'block';
            showMsg('Willkommen in der Rick & Morty Dimension! Finde Rick & Morty! Geh zurueck zum gruenen Portal!', 7000);
        }
        if (inRM && portalCD <= 0) {
            const ep = new THREE.Vector3(RM.x, RM.y + 3.5, RM.z);
            if (pPos.distanceTo(ep) < 3.8) {
                inRM = false; portalCD = 5;
                pPos.set(-12, getH(-12,18) + 4, 25); pVel.set(0,0,0);
                scene.background = new THREE.Color(0x0a0520);
                scene.fog = new THREE.Fog(0x0a0520, 60, 200);
                document.getElementById('dimension').style.display = 'none';
                showMsg('Zurueck in der normalen Welt!', 3000);
            }
        }

        // Camera — folgt Mausbewegung in beide Modi
        const camTarget = inUFO
            ? ufo.position.clone().add(new THREE.Vector3(0, 0.5, 0))
            : pPos.clone().add(new THREE.Vector3(0, 0.8, 0));
        const camX = camTarget.x + Math.sin(yaw) * camDist * Math.cos(pitch);
        const camY = camTarget.y - Math.sin(pitch) * camDist + 1.5;
        const camZ = camTarget.z + Math.cos(yaw) * camDist * Math.cos(pitch);
        camera.position.set(camX, Math.max(camTarget.y - 4, camY), camZ);
        camera.lookAt(camTarget);

        renderer.render(scene, camera);
    }

    loop();
    showMsg('Klicke zum Spielen! Finde das gruene Portal!', 5000);
}

window.addEventListener('resize', () => {
    if (typeof camera !== 'undefined') {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    }
});
</script>
</body>
</html>
